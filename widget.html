<script>
  const QUOTES = [
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
    { text: "You don't have to see the whole staircase, just take the first step.", author: "Martin Luther King Jr." },
    { text: "Focus on being productive instead of busy.", author: "Tim Ferriss" },
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "Either you run the day, or the day runs you.", author: "Jim Rohn" },
    { text: "Concentrate all your thoughts upon the work in hand.", author: "Alexander Graham Bell" },
    { text: "Great things are done by a series of small things brought together.", author: "Vincent van Gogh" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Push yourself, because no one else is going to do it for you.", author: null },
  ];

  const PARKED_KEY = 'widget:parked';

  function getWidgetParked() {
    try { return JSON.parse(localStorage.getItem(PARKED_KEY) || '[]'); } catch { return []; }
  }

  function saveWidgetParked(list) {
    localStorage.setItem(PARKED_KEY, JSON.stringify(list.slice(0, 50)));
  }

  function renderParkedList() {
    var parked = getWidgetParked();
    if (parked.length === 0) return '';
    var items = parked.map(function(t, i) {
      return '<li class="park-saved-item">'
        + '<span class="park-saved-text">' + escHtml(t.text) + '</span>'
        + '<button class="park-saved-dismiss" data-idx="' + i + '" title="Dismiss">×</button>'
        + '</li>';
    }).join('');
    return '<p class="park-saved-label">Saved thoughts</p><ul class="park-saved-list">' + items + '</ul>';
  }

  const STUCK_TIPS = [
    "Break it into one tiny next step",
    "Explain the problem out loud (rubber duck)",
    "Take a 5-minute walk — let your brain reset",
    "Write what you DO know; the gap becomes clear",
    "Ask: what is blocking me specifically?",
  ];

  const dotEl           = document.getElementById('dot');
  const taskEl          = document.getElementById('task');
  const taskInnerEl     = document.getElementById('task-inner');
  const taskMeasureEl   = document.getElementById('task-measure');
  const taskHoverEl     = document.getElementById('task-hover');
  const taskHoverTextEl = document.getElementById('task-hover-text');
  const timerEl         = document.getElementById('timer');
  const panelEl         = document.getElementById('panel');
  const panelBodyEl     = document.getElementById('panel-body');
  const panelFooter     = document.getElementById('panel-footer');
  const panelSavedEl    = document.getElementById('panel-saved');
  const doneBtnEl       = document.getElementById('done-btn');
  const doneCheckEl     = document.getElementById('done-check');
  const wrapperEl       = document.querySelector('.wrapper');
  const playBtnEl       = document.getElementById('play-btn');
  const timerCompleteEl = document.getElementById('timer-complete');
  const nudgeMsgEl      = document.getElementById('nudge-msg');
  const nudgeConfirmEl  = document.getElementById('nudge-confirm');
  const nudgeEscapeEl   = document.getElementById('nudge-escape');

  let currentAction = null;
  let pendingAI = {};
  let reqCounter = 0;
  let doneAnimating = false;
  let taskFlashing = false;
  let hoverExpanded = false;
  let hoverTimer = null;
  let currentNudge = null;
  let nudgeAutoTimer = null;

  // The condensed strip runs in a dedicated opaque window embedded in the
  // taskbar, loaded with #condensed — it renders the compact view permanently.
  var isCondensedWindow = location.hash === '#condensed';
  if (isCondensedWindow) {
    document.body.setAttribute('data-condensed', 'true');
  }

  var assistBtnEl = document.getElementById('assist-btn');
  var assistFanEl = document.getElementById('assist-fan');
  var assistOpen = false;
  var condensedStripH = 0;
  var currentTaskText = null;
  var currentContextTaskText = null;
  var breatheTimer = null;

  // Actions that build on the active task (smart prompt / strategy)
  var ASSIST_NEEDS_TASK = { prompt: true, claude: true, chatgpt: true, strategy: true };

  var BREATHE_PHASES = [
    { key: 'in',       label: 'Breathe In'  },
    { key: 'hold-in',  label: 'Hold'        },
    { key: 'out',      label: 'Breathe Out' },
    { key: 'hold-out', label: 'Hold'        },
  ];

  function stopBreathing() {
    clearInterval(breatheTimer);
    breatheTimer = null;
  }

  // 4-4-4-4 box breathing, mirroring the Do! screen's breathing guide
  function startBreathing() {
    stopBreathing();
    var idx = 0;
    var remaining = 4;
    function apply() {
      var circle = document.getElementById('breathe-circle');
      if (!circle) { stopBreathing(); return; }
      circle.className = 'breathe-circle phase-' + BREATHE_PHASES[idx].key;
      document.getElementById('breathe-label').textContent = BREATHE_PHASES[idx].label;
      document.getElementById('breathe-count').textContent = remaining;
    }
    apply();
    breatheTimer = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        idx = (idx + 1) % BREATHE_PHASES.length;
        remaining = 4;
      }
      apply();
    }, 1000);
  }

  // Grow / restore the condensed strip window upward. The strip's base height
  // never changes while embedded, so it is captured once on the first growth —
  // re-reading innerHeight on later cycles races the async native resize
  // (fan→panel transitions happen while the window is still grown).
  function setCondensedGrow(extra) {
    if (extra > 0 && !condensedStripH) {
      condensedStripH = window.innerHeight;
      document.documentElement.style.setProperty('--strip-h', condensedStripH + 'px');
    }
    if (extra > 0) document.body.setAttribute('data-grown', 'true');
    else document.body.removeAttribute('data-grown');
    window.widget && window.widget.setHoverExpand(extra);
  }

  // Grow / restore the window for the assist fan: the condensed strip goes
  // through the anchored-strip path; the bar style grows via the plain
  // hover-expand path (which already grows upward for bar).
  function assistGrow(extra) {
    if (isCondensedWindow) setCondensedGrow(extra);
    else window.widget && window.widget.setHoverExpand(extra);
  }

  function openAssistFan() {
    if (assistOpen) return;
    closeAutopilotMenu(true); // mutually exclusive — keep the window grown
    var style = document.body.getAttribute('data-style');
    // Clear the hover flyout state WITHOUT resizing to base height first —
    // the window grows straight to the fan height (no shrink/grow bounce)
    clearTimeout(hoverTimer);
    hoverTimer = null;
    clearTimeout(collapseTimer);
    collapseTimer = null;
    hoverExpanded = false;
    document.body.removeAttribute('data-hover-expand');
    holdEntranceUntilResize();
    document.body.setAttribute('data-assist-open', 'true');
    assistOpen = true;
    assistBtnEl.classList.add('active');
    // Sidebar's window is already full height — the fan shows inline, no growth
    if (!isCondensedWindow && style === 'sidebar') return;
    assistGrow(Math.min(220, assistFanEl.offsetHeight));
  }

  // keepGrow: when a fan option opens the panel the window stays grown and the
  // panel sizing (resize observer / main-process panel bounds) takes over —
  // no bounce to base height.
  function closeAssistFan(keepGrow) {
    if (!assistOpen) return;
    assistOpen = false;
    document.body.removeAttribute('data-assist-open');
    assistBtnEl.classList.remove('active');
    if (!keepGrow) assistGrow(0);
  }

  let collapseTimer = null;

  function collapseTaskHover() {
    clearTimeout(hoverTimer);
    hoverTimer = null;
    clearTimeout(collapseTimer);
    collapseTimer = null;
    if (!hoverExpanded) return;
    hoverExpanded = false;
    document.body.removeAttribute('data-hover-expand');
    if (isCondensedWindow) setCondensedGrow(0);
    else window.widget && window.widget.setHoverExpand(0);
  }

  function expandTaskHover() {
    if (hoverExpanded) return;
    var style = document.body.getAttribute('data-style');
    var condensed = document.body.getAttribute('data-condensed') === 'true';
    if (style === 'sidebar' && !condensed) return; // sidebar already wraps task text
    if (panelEl.classList.contains('open')) return;
    if (assistOpen) return;
    if (document.getElementById('celebration-overlay').classList.contains('active')) return;
    // In the taskbar strip the flyout always opens — live tracing showed real
    // tasks hover within a couple of px of the container width, so any
    // truncation gate is a coin-flip there. The pill keeps the gate, measured
    // via the hidden span (the visible line is ellipsized, so its own widths
    // are useless for this).
    if (!condensed) {
      taskMeasureEl.textContent = taskInnerEl.textContent;
      if (taskMeasureEl.getBoundingClientRect().width <= taskEl.getBoundingClientRect().width + 2) return;
    }
    taskHoverTextEl.textContent = taskInnerEl.textContent;
    holdEntranceUntilResize();
    document.body.setAttribute('data-hover-expand', 'true');
    hoverExpanded = true;
    var dh = Math.min(160, taskHoverEl.offsetHeight);
    if (condensed) setCondensedGrow(dh);
    else window.widget && window.widget.setHoverExpand(dh);
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Entrance animations are held paused (CSS: [data-anim-hold]) until the
  // async native window growth lands — its resize event releases them, so the
  // animation plays on visible pixels instead of finishing while clipped.
  // The fallback timer covers opens that don't resize the window (e.g. the
  // fan→panel transition, which keeps the grown bounds).
  var animHoldTimer = null;
  function releaseEntranceHold() {
    clearTimeout(animHoldTimer);
    animHoldTimer = null;
    requestAnimationFrame(function() {
      document.body.removeAttribute('data-anim-hold');
    });
  }
  function holdEntranceUntilResize() {
    document.body.setAttribute('data-anim-hold', 'true');
    clearTimeout(animHoldTimer);
    animHoldTimer = setTimeout(releaseEntranceHold, 150);
  }
  window.addEventListener('resize', function() {
    if (animHoldTimer) releaseEntranceHold();
  });

  function callWidgetAI(type, extra) {
    return new Promise(function(resolve, reject) {
      var requestId = 'w' + (++reqCounter);
      pendingAI[requestId] = { resolve: resolve, reject: reject };
      var payload = { requestId: requestId, type: type };
      if (extra) { for (var k in extra) payload[k] = extra[k]; }
      window.widget && window.widget.callAI(payload);
      setTimeout(function() {
        if (pendingAI[requestId]) {
          delete pendingAI[requestId];
          reject(new Error('timeout'));
        }
      }, 30000);
    });
  }

  function fmt(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function trunc(text, max) {
    return text && text.length > max ? text.slice(0, max) + '…' : text;
  }

  // ── Nudge ─────────────────────────────────────────────────────────────────

  function dismissNudge() {
    clearTimeout(nudgeAutoTimer);
    nudgeAutoTimer = null;
    currentNudge = null;
    document.body.removeAttribute('data-nudge');
    window.widget && window.widget.nudgeDismiss();
    collapseTaskHover();
  }

  function applyNudge(nudge) {
    if (currentNudge && currentNudge.message === nudge.message) return;
    currentNudge = nudge;
    nudgeMsgEl.textContent = nudge.message;
    nudgeConfirmEl.textContent = nudge.confirmText;
    nudgeEscapeEl.textContent = nudge.escapeText;
    document.body.setAttribute('data-nudge', 'true');
    taskHoverTextEl.textContent = taskInnerEl.textContent;
    // Mark expanded before rAF so collapseTaskHover recognises the state
    document.body.setAttribute('data-hover-expand', 'true');
    hoverExpanded = true;
    // Measure after the DOM paints so offsetHeight includes the nudge section
    requestAnimationFrame(function() {
      holdEntranceUntilResize();
      var isCondensed = document.body.getAttribute('data-condensed') === 'true';
      var dh = Math.min(180, taskHoverEl.offsetHeight);
      if (isCondensed) setCondensedGrow(dh);
      else window.widget && window.widget.setHoverExpand(dh);
    });
    // Auto-dismiss after 10 s if no interaction
    clearTimeout(nudgeAutoTimer);
    nudgeAutoTimer = setTimeout(dismissNudge, 10000);
  }

  nudgeConfirmEl.addEventListener('click', function() {
    if (!currentNudge) return;
    var wasConfirm = true;
    dismissNudge();
    // "Keep going" → restart the timer for the same task
    if (wasConfirm) window.widget && window.widget.toggleTimer();
  });

  nudgeEscapeEl.addEventListener('click', function() {
    if (!currentNudge) return;
    dismissNudge();
    // "Done with it" → mark the current task done
    window.widget && window.widget.taskDone();
  });

  // ──────────────────────────────────────────────────────────────────────────

  // AI-Automate round-trip state: set on click, cleared by the app's
  // explicit completion signal (widget:automate-done) — the safety timer
  // only covers a dead main window. automateFlashPending keeps the
  // chosen-task flash working when the done signal beats the task push.
  var automateWaiting = false;
  var automateTimer = null;
  var automateFlashPending = false;

  function update(state) {
    var task      = state.task || null;
    var secs      = state.seconds || 0;
    var isRunning = !!state.running;
    var mode      = state.mode || 'focus';
    var isAlarm   = !!state.alarm;
    currentTaskText = task;
    currentContextTaskText = state.contextTask || null;

    // Incoming nudge from the model — show confirm-or-correct prompt
    if (state.nudge && !isRunning) {
      applyNudge(state.nudge);
    } else if (!state.nudge && currentNudge) {
      dismissNudge();
    }

    // Show/hide capture button in assist fan
    var captureBtnEl = document.getElementById('capture-btn');
    if (captureBtnEl) {
      captureBtnEl.style.display = (currentContextTaskText && !task) ? '' : 'none';
    }

    if (!taskFlashing) {
      var taskText, taskClass;
      if (task) {
        taskText  = task;
        taskClass = 'task-text';
      } else if (currentContextTaskText) {
        taskText  = currentContextTaskText;
        taskClass = 'task-text context-inferred';
      } else {
        taskText  = 'No active task';
        taskClass = 'task-text idle';
      }
      if (taskInnerEl.textContent !== taskText) {
        taskInnerEl.textContent = taskText;
        if (hoverExpanded) taskHoverTextEl.textContent = taskText;
      }
      if (taskEl.className !== taskClass) taskEl.className = taskClass;

      // AI-Automate answer arrived: flash the chosen task in the bar
      if ((automateWaiting || automateFlashPending) && task) {
        automateFlashPending = false;
        finishAutomate();
        taskFlashing = true;
        taskEl.className = taskClass + ' next-task-flash';
        setTimeout(function() {
          taskFlashing = false;
          taskEl.classList.remove('next-task-flash');
        }, 2000);
      }
    }

    var timerText, timerClass;
    if (isAlarm) {
      // Chip already reads "Timer Complete"; hide the redundant 0:00 so the
      // green timer text doesn't crowd the chip and the Done button.
      timerText  = '0:00';
      timerClass = 'timer-text complete-hidden';
      timerCompleteEl.classList.add('visible');
    } else {
      timerCompleteEl.classList.remove('visible');
      if (secs > 0) {
        timerText  = fmt(secs);
        timerClass = 'timer-text' + (mode === 'break' ? ' break' : '');
      } else {
        timerText  = '—:——';
        timerClass = 'timer-text idle';
      }
    }
    if (timerEl.textContent !== timerText) timerEl.textContent = timerText;
    if (timerEl.className  !== timerClass) timerEl.className  = timerClass;

    var dotClass = 'dot' + (isRunning ? (mode === 'break' ? ' break' : '') : ' paused');
    if (dotEl.className !== dotClass) dotEl.className = dotClass;

    if (!doneAnimating) {
      doneBtnEl.classList.toggle('hidden', !task);
    }

    playBtnEl.textContent = isRunning ? '⏸' : '▶';
    playBtnEl.classList.toggle('running', isRunning);
    playBtnEl.title = isRunning ? 'Pause' : 'Play';

    // Suggest-open pulse: throttled to avoid localStorage reads every second
    var nowTs = Date.now();
    if (nowTs - lastAssistPulseCheck > 30000) {
      lastAssistPulseCheck = nowTs;
      var dc = getSessionDistractCount();
      var pc = getWidgetParked().length;
      assistBtnEl.classList.toggle('suggest', !assistOpen && (dc >= 3 || pc >= 4));
    }
  }

  function getInput() {
    return document.getElementById('panel-input');
  }

  // ── AI result rendering helpers ──
  function aiLoaderHtml(label) {
    return '<div class="ai-loader"><span class="ai-loader-dots"><i></i><i></i><i></i></span>'
      + '<span class="ai-loader-label">' + escHtml(label) + '</span></div>';
  }

  function aiCardHtml(variant, label, bodyHtml, delay) {
    return '<div class="ai-card' + (variant ? ' ai-card-' + variant : '') + '"'
      + (delay ? ' style="animation-delay:' + delay + 's"' : '') + '>'
      + (label ? '<span class="ai-card-label">' + escHtml(label) + '</span>' : '')
      + '<div class="ai-card-body">' + bodyHtml + '</div></div>';
  }

  function aiSuccessHtml(message) {
    return '<div class="ai-success"><span class="ai-success-ring">✓</span>' + escHtml(message) + '</div>';
  }

  // Quote reveals word by word; author fades in once the last word lands.
  function quoteRevealHtml(text, author) {
    var words = String(text).trim().split(/\s+/);
    var spans = words.map(function(w, i) {
      return '<span class="qw" style="animation-delay:' + (0.15 + i * 0.04).toFixed(2) + 's">' + escHtml(w) + '</span>';
    }).join(' ');
    var authorDelay = (0.35 + words.length * 0.04).toFixed(2);
    return '<p class="ai-quote"><span class="ai-quote-mark">“</span>' + spans + '<span class="ai-quote-mark">”</span></p>'
      + (author ? '<p class="panel-author" style="animation-delay:' + authorDelay + 's">— ' + escHtml(author) + '</p>' : '');
  }

  // ── Quote-repeat prevention ──────────────────────────────────────────────
  var RECENT_QUOTE_AUTHORS_KEY = 'widget:recentQuoteAuthors';
  function getRecentQuoteAuthors() {
    try { return JSON.parse(localStorage.getItem(RECENT_QUOTE_AUTHORS_KEY) || '[]'); } catch { return []; }
  }
  function saveRecentQuoteAuthor(author) {
    if (!author) return;
    var list = getRecentQuoteAuthors();
    list = list.filter(function(a) { return a !== author; });
    list.unshift(author);
    localStorage.setItem(RECENT_QUOTE_AUTHORS_KEY, JSON.stringify(list.slice(0, 10)));
  }

  // ── In-session AI result cache ────────────────────────────────────────────
  var aiResultCache = {};
  function getAICache(action, key) { return aiResultCache[action + ':' + (key || '')] || null; }
  function setAICache(action, key, result) {
    if (result === null) { delete aiResultCache[action + ':' + (key || '')]; return; }
    aiResultCache[action + ':' + (key || '')] = result;
  }

  // ── Fan usage tracking ────────────────────────────────────────────────────
  var FAN_USAGE_KEY = 'widget:fan-usage';
  function trackFanUsage(action) {
    try {
      var map = JSON.parse(localStorage.getItem(FAN_USAGE_KEY) || '{}');
      map[action] = (map[action] || 0) + 1;
      localStorage.setItem(FAN_USAGE_KEY, JSON.stringify(map));
    } catch {}
  }

  // ── Distraction count for suggest-pulsing ────────────────────────────────
  function getSessionDistractCount() {
    try {
      var d = JSON.parse(localStorage.getItem('hub:widget:distraction') || '[]');
      var cutoff = Date.now() - 4 * 60 * 60 * 1000;
      return d.filter(function(x) { return (x.ts || 0) > cutoff; }).length;
    } catch { return 0; }
  }
  var lastAssistPulseCheck = 0;

  // ── Error display with optional retry ────────────────────────────────────
  var _lastRetryFn = null;
  function showError(msg, retryFn) {
    _lastRetryFn = retryFn || null;
    panelBodyEl.innerHTML = '<p class="panel-error">' + escHtml(msg || 'Something went wrong.')
      + (retryFn ? '</p><button class="error-retry-btn">↺ Try again</button>' : '</p>');
    if (retryFn) {
      var btn = panelBodyEl.querySelector('.error-retry-btn');
      if (btn) btn.addEventListener('click', retryFn);
    }
  }

  function showFallbackQuote() {
    var q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    panelBodyEl.innerHTML = quoteRevealHtml(q.text, q.author);
  }

  function showFallbackStuck() {
    var tips = STUCK_TIPS.map(function(t) { return '<li>' + escHtml(t) + '</li>'; }).join('');
    panelBodyEl.innerHTML = '<ul class="panel-tips">' + tips + '</ul>'
      + '<textarea class="panel-input" id="panel-input" rows="2" placeholder="Describe what\'s blocking you…"></textarea>';
    var inp = getInput();
    if (inp) { setTimeout(function() { inp.focus(); }, 50); }
  }

  // ── Explore pop-up panel ──
  // Compact Idea Explorer: explores the active task (or a typed idea), shows
  // the five sections, and supports drill-down (click an item to explore it)
  // with back navigation. The stack keeps earlier results so back is instant.
  var exploreStack = [];
  var exploreRootTask = null;
  // Last analyse scan's suggestions, indexed by the + buttons in the results
  var analyseSuggestions = [];
  // Last strategy's steps, indexed by the tickable list and its + buttons
  var strategySteps = [];

  var EXPLORE_SECTIONS = [
    { key: 'todaysPossibilities', label: "Today's picks", icon: '⚡' },
    { key: 'questions',           label: 'Questions',     icon: '?' },
    { key: 'approaches',          label: 'Approaches',    icon: '→' },
    { key: 'edgeOfIdea',          label: 'Wild angles',   icon: '✦' },
    { key: 'risks',               label: 'Watch out for', icon: '!' },
  ];

  function getExploreItem(secKey, idx) {
    var top = exploreStack[exploreStack.length - 1];
    var items = top && top.result && top.result[secKey];
    return (items && items[idx]) || null;
  }

  function renderExploreInput() {
    panelBodyEl.innerHTML =
      '<textarea class="panel-input" id="panel-input" rows="2" placeholder="An idea, problem, or goal to explore…"></textarea>'
      + '<button class="panel-btn explore-go" id="explore-go">explore</button>';
    var inp = getInput();
    if (inp) { setTimeout(function() { inp.focus(); }, 50); }
  }

  function runExplore(idea) {
    panelBodyEl.innerHTML = aiLoaderHtml('Exploring ' + trunc(idea, 40) + '…');
    callWidgetAI('explore', { idea: idea }).then(function(result) {
      if (currentAction !== 'explore') return;
      if (result && (result.todaysPossibilities || result.questions || result.approaches)) {
        exploreStack.push({ idea: idea, result: result });
        renderExplore();
      } else {
        showError('Could not explore. Check your AI settings.', function() { runExplore(idea); });
      }
    }).catch(function(err) {
      if (currentAction !== 'explore') return;
      showError(err.message || 'Could not explore.', function() { runExplore(idea); });
    });
  }

  function renderExplore() {
    var top = exploreStack[exploreStack.length - 1];
    if (!top) { renderExploreInput(); return; }
    var html = '<div class="explore-head">'
      + (exploreStack.length > 1 ? '<button class="explore-back" id="explore-back" title="Back">←</button>' : '')
      + '<span class="explore-idea" title="' + escHtml(top.idea) + '">' + escHtml(trunc(top.idea, 70)) + '</span>'
      + '</div>';
    EXPLORE_SECTIONS.forEach(function(sec) {
      var items = top.result[sec.key];
      if (!items || !items.length) return;
      html += '<p class="explore-section">' + sec.icon + ' ' + sec.label + '</p><ul class="explore-list">';
      items.forEach(function(item, i) {
        html += '<li class="explore-item">'
          + '<button class="explore-item-text" data-sec="' + sec.key + '" data-i="' + i + '" title="Explore deeper">'
          + escHtml(item) + '</button>'
          + '<button class="explore-item-add" data-sec="' + sec.key + '" data-i="' + i + '" title="Add as task">+</button>'
          + '</li>';
      });
      html += '</ul>';
    });
    panelBodyEl.innerHTML = html;
  }

  function buildRecapHtml() {
    var cutoff = Date.now() - 4 * 60 * 60 * 1000;
    var parks = getWidgetParked();
    var distracts = [];
    try { distracts = JSON.parse(localStorage.getItem('hub:widget:distraction') || '[]'); } catch {}
    distracts = distracts.filter(function(d) { return (d.ts || 0) > cutoff; });
    var stuckLogs = [];
    try { stuckLogs = JSON.parse(localStorage.getItem('hub:widget:stuck') || '[]'); } catch {}
    stuckLogs = stuckLogs.filter(function(d) { return (d.ts || 0) > cutoff; });

    var html = '<span class="ai-section-label">Last 4 hours</span>';
    html += '<div class="recap-stat" style="animation-delay:0.05s"><span>Parks captured</span><span class="recap-stat-num">' + parks.length + '</span></div>';
    html += '<div class="recap-stat" style="animation-delay:0.1s"><span>Distractions logged</span><span class="recap-stat-num">' + distracts.length + '</span></div>';
    html += '<div class="recap-stat" style="animation-delay:0.15s"><span>Stuck moments</span><span class="recap-stat-num">' + stuckLogs.length + '</span></div>';

    if (parks.length) {
      html += '<span class="ai-section-label" style="margin-top:7px">Parked thoughts</span>';
      parks.slice(0, 4).forEach(function(p) { html += aiCardHtml('', null, escHtml(p.text)); });
      if (parks.length > 4) html += '<p class="ai-intro">+ ' + (parks.length - 4) + ' more in Park list</p>';
    }
    if (distracts.length) {
      html += '<span class="ai-section-label" style="margin-top:7px">Distractions</span>';
      distracts.slice(0, 3).forEach(function(d) {
        html += '<p class="stuck-comp-row">' + escHtml(d.text || '(unnamed)') + '</p>';
      });
    }
    if (!parks.length && !distracts.length && !stuckLogs.length) {
      html += aiSuccessHtml('Clean session — nothing logged yet.');
    }
    return html;
  }

  function openPanel(action) {
    collapseTaskHover();
    closeAssistFan(true);
    closeAutopilotMenu(true);
    stopBreathing();
    currentAction = action;

    document.querySelectorAll('.action-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.action === action);
    });

    panelSavedEl.classList.remove('show');
    if (!panelEl.classList.contains('open')) holdEntranceUntilResize();
    panelEl.classList.add('open');
    window.widget && window.widget.setPanelOpen(true);

    if (ASSIST_NEEDS_TASK[action] && !currentTaskText) {
      panelFooter.style.display = 'none';
      panelBodyEl.innerHTML = '<p class="panel-error">No active task — pick a task in the app first.</p>';
      setTimeout(function() { if (currentAction === action) closePanel(); }, 1800);
      return;
    }

    if (action === 'motivate') {
      panelFooter.style.display = 'none';
      var _motivateCacheKey = currentTaskText || '';
      var _motivateCached = getAICache('motivate', _motivateCacheKey);

      function renderMotivate(result, fromCache) {
        if (result && result.quote) {
          var impactDelay = (0.55 + String(result.quote).trim().split(/\s+/).length * 0.04).toFixed(2);
          var rfHtml = fromCache
            ? '<button class="ai-refresh-btn" id="motivate-refresh" title="Get a fresh quote">↺ refresh</button>'
            : '';
          panelBodyEl.innerHTML = rfHtml + quoteRevealHtml(result.quote, result.author)
            + (result.impact ? aiCardHtml('', 'Why it matters today', escHtml(result.impact), impactDelay) : '');
          var rfEl = document.getElementById('motivate-refresh');
          if (rfEl) rfEl.addEventListener('click', function() {
            setAICache('motivate', _motivateCacheKey, null);
            if (currentAction === 'motivate') openPanel('motivate');
          });
        } else {
          showFallbackQuote();
        }
      }

      if (_motivateCached) {
        renderMotivate(_motivateCached, true);
      } else {
        panelBodyEl.innerHTML = aiLoaderHtml('Finding your spark…');
        var _recentAuthors = getRecentQuoteAuthors();
        callWidgetAI('motivate', { recentAuthors: _recentAuthors }).then(function(result) {
          if (currentAction !== 'motivate') return;
          if (result && result.quote) {
            saveRecentQuoteAuthor(result.author);
            setAICache('motivate', _motivateCacheKey, result);
          }
          renderMotivate(result, false);
        }).catch(function() {
          if (currentAction !== 'motivate') return;
          showFallbackQuote();
        });
      }

    } else if (action === 'stuck') {
      panelFooter.style.display = 'none';
      var _stuckBlockType = 'start';

      function stuckHelperHtml() {
        return '<div class="stuck-helper" id="stuck-helper">'
          + '<span class="ai-section-label" style="margin-top:6px">Get targeted help</span>'
          + '<div class="stuck-type-btns" id="stuck-type-btns">'
          + '<button class="stuck-type-btn' + (_stuckBlockType === 'start' ? ' active' : '') + '" data-btype="start">Can\'t start</button>'
          + '<button class="stuck-type-btn' + (_stuckBlockType === 'big' ? ' active' : '') + '" data-btype="big">Too big</button>'
          + '<button class="stuck-type-btn' + (_stuckBlockType === 'info' ? ' active' : '') + '" data-btype="info">Missing info</button>'
          + '</div>'
          + '<textarea class="panel-input" id="stuck-desc" rows="2" placeholder="Optional: describe what\'s blocking you…"></textarea>'
          + '<button class="stuck-help-btn" id="stuck-help-btn">Get help →</button>'
          + '</div>';
      }

      function renderStuckResult(result, extra) {
        var html = '';
        if (extra) html += extra;
        if (!result) return html;
        if (result.headline) html += '<p class="ai-intro" style="animation-delay:0s">' + escHtml(result.headline) + '</p>';
        if (result.recommendation) html += aiCardHtml('', 'Next move', escHtml(result.recommendation), 0.1);
        (result.complications || []).slice(0, 4).forEach(function(c, i) {
          var rows = '';
          if (c.why) rows += '<p class="stuck-comp-row"><b>Why it\'s heavy</b>' + escHtml(c.why) + '</p>';
          if (c.fix) rows += '<p class="stuck-comp-row"><b class="fix">Quick fix</b>' + escHtml(c.fix) + '</p>';
          if (c.approach) rows += '<p class="stuck-comp-row"><b class="angle">Smarter angle</b>' + escHtml(c.approach) + '</p>';
          if (!rows) return;
          html += '<div class="stuck-comp" style="animation-delay:' + (0.18 + i * 0.07).toFixed(2) + 's">'
            + '<button class="stuck-comp-head">' + escHtml(trunc(c.task || 'This task', 60))
            + '<span class="stuck-comp-chev">▼</span></button>'
            + '<div class="stuck-comp-body"><div class="stuck-comp-rows">' + rows + '</div></div></div>';
        });
        if (result.quickWins && result.quickWins.length) {
          html += '<span class="ai-section-label" style="animation-delay:0.3s">Quick wins — click + to add as a task</span>'
            + '<div class="ai-chips">'
            + result.quickWins.slice(0, 3).map(function(q, i) {
              return '<span class="ai-chip" data-qtext="' + escHtml(q) + '" style="animation-delay:' + (0.36 + i * 0.08).toFixed(2) + 's">'
                + escHtml(q) + '<button class="ai-chip-add" title="Add as task">+</button></span>';
            }).join('') + '</div>';
        }
        // Targeted help result fields
        if (result.why) html += aiCardHtml('', 'What\'s blocking you', escHtml(result.why), 0.12);
        if (result.firstStep) html += aiCardHtml('green', 'First step', escHtml(result.firstStep), 0.2);

      panelBodyEl.innerHTML = aiLoaderHtml('Reading your board…') + stuckHelperHtml();

        if (currentAction !== 'stuck') return;

    } else if (action === 'park') {

      panelBodyEl.addEventListener('click', function(e) {

    } else if (action === 'breathe') {

    } else if (action === 'prompt') {
      panelFooter.style.display = 'none';
      panelBodyEl.innerHTML = aiLoaderHtml('Building your prompt…');
      callWidgetAI('prompt').then(function(result) {
        if (currentAction !== 'prompt') return;
        if (result && result.prompt) {
          window.widget && window.widget.copyText && window.widget.copyText(result.prompt);

      });

    } else if (action === 'claude' || action === 'chatgpt') {
      var svcName = action === 'claude' ? 'Claude' : 'ChatGPT';
      panelFooter.style.display = 'none';
      panelBodyEl.innerHTML = aiLoaderHtml('Opening ' + svcName + '…');
      callWidgetAI(action).then(function(result) {
        if (currentAction !== action) return;
        if (result && result.tooLong && result.prompt) {

    } else if (action === 'strategy') {
      panelFooter.style.display = 'none';

      var _stratCached = getAICache('strategy', _stratCacheKey);

      function renderStrategy(result, fromCache) {
        if (!(result && result.headline)) {
          showError('Could not generate a strategy. Check your AI settings.', function() { openPanel('strategy'); });
          return;
        }
        strategySteps = (result.steps || []).slice(0, 6);

        var html = '<p class="ai-intro">' + escHtml(result.headline) + '</p>';
        if (fromCache) html += '<button class="ai-refresh-btn" id="strategy-refresh" style="margin-bottom:4px">↺ refresh strategy</button>';
        if (result.firstMove) html += aiCardHtml('', 'First move', escHtml(result.firstMove), 0.08);
        if (strategySteps.length) {
          html += '<div class="strategy-progress"><div class="strategy-progress-fill" id="strategy-progress-fill"></div></div>'
            + '<ul class="strategy-steps">'
            + strategySteps.map(function(s, i) {
              var isDone = savedTicks[i] === true;
              return '<li class="strategy-step' + (isDone ? ' done' : '') + '" data-i="' + i + '" style="animation-delay:' + (0.16 + i * 0.06).toFixed(2) + 's" title="Click to tick off">'
                + '<span class="strategy-step-tick">✓</span>'
                + '<span class="strategy-step-text">' + escHtml(s) + '</span>'
                + '<button class="explore-item-add strategy-step-add" data-i="' + i + '" title="Add as sub-task">+</button>'
                + '</li>';
            }).join('') + '</ul>';
          html += '<button class="strategy-add-all" id="strategy-add-all">Convert all steps to sub-tasks</button>';
        }
        if (result.watchOut) html += aiCardHtml('amber', 'Watch out', escHtml(result.watchOut), 0.32);
        if (result.doneWhenYouSee) html += aiCardHtml('green', 'Done when you see', escHtml(result.doneWhenYouSee), 0.4);
        panelBodyEl.innerHTML = html;
        // Restore progress bar
        var doneCount = savedTicks.filter(Boolean).length;
        var fill = document.getElementById('strategy-progress-fill');
        if (fill && strategySteps.length) fill.style.width = Math.round((doneCount / strategySteps.length) * 100) + '%';
        var rfEl = document.getElementById('strategy-refresh');
        if (rfEl) rfEl.addEventListener('click', function() {
          setAICache('strategy', _stratCacheKey, null);
          if (currentAction === 'strategy') openPanel('strategy');
        });
      }

      if (_stratCached) {
        renderStrategy(_stratCached, true);
      } else {
        panelBodyEl.innerHTML = aiLoaderHtml('Mapping the fastest path…');
        callWidgetAI('strategy').then(function(result) {
          if (currentAction !== 'strategy') return;
          if (result && result.headline) setAICache('strategy', _stratCacheKey, result);
          renderStrategy(result, false);
        }).catch(function(err) {
          if (currentAction !== 'strategy') return;
          showError(err.message || 'Could not generate a strategy.', function() { openPanel('strategy'); });
        });
      }

    } else if (action === 'explore') {
      panelFooter.style.display = 'none';
      exploreStack = [];
      exploreRootTask = currentTaskText || null;
      if (currentTaskText) {
        runExplore(currentTaskText);
      } else {
        renderExploreInput();
      }

    } else if (action === 'recap') {
      panelFooter.style.display = 'none';
      panelBodyEl.innerHTML = buildRecapHtml();

    } else if (action === 'analyse') {
      panelFooter.style.display = 'none';
      var analyseModeHtml = '<div class="analyse-mode-btns">'
        + '<button class="analyse-mode-btn" id="analyse-full">🖥 Whole Screen</button>'
        + '<button class="analyse-mode-btn" id="analyse-window">🪟 Active Window</button>'
        + '<button class="analyse-mode-btn" id="analyse-area">✂ Select Area</button>'
        + '<button class="analyse-mode-btn" id="analyse-document">📄 Document</button>'
        + '</div>';
      panelBodyEl.innerHTML = analyseModeHtml;

      function startAnalyse(mode) {
        panelBodyEl.innerHTML = mode === 'document'
          ? aiLoaderHtml('Reading your document…')
          : aiLoaderHtml('Analysing your screen…');
        var reqId = 'w' + (++reqCounter);
        pendingAI[reqId] = {
          resolve: function(result) {
            if (currentAction !== 'analyse') return;
            if (result && result.analysis) {
              analyseSuggestions = (result.suggestions || []).slice(0, 3);
              var sugs = analyseSuggestions.map(function(s, i) {
                return '<li style="animation-delay:' + (0.14 + i * 0.07).toFixed(2) + 's">'
                  + '<span class="analyse-sug-text">' + escHtml(s) + '</span>'
                  + '<button class="explore-item-add analyse-sug-add" data-i="' + i + '" title="Add as task">+</button></li>';
              }).join('');
              panelBodyEl.innerHTML = aiCardHtml('', 'What I see', escHtml(result.analysis))
                + (sugs
                  ? '<span class="ai-section-label" style="animation-delay:0.1s">Next actions — click + to add as a task</span>'
                    + '<ul class="panel-tips analyse-sugs">' + sugs + '</ul>'
                  : '');
            } else {
              panelBodyEl.innerHTML = '<p class="panel-error">No analysis returned. Check your AI settings.</p>';
            }
          },
          reject: function(err) {
            if (currentAction !== 'analyse') return;
            var msg = (err && err.message) || 'Analyse failed';
            if (msg === 'Cancelled') {
              panelBodyEl.innerHTML = analyseModeHtml;
              attachAnalyseBtns();
              return;
            }
            panelBodyEl.innerHTML = '<p class="panel-error">' + escHtml(msg) + '</p>';
          }
        };
        // Document mode runs COM extraction (up to 45s) plus a long-context AI call
        setTimeout(function() {
          if (pendingAI[reqId]) { delete pendingAI[reqId]; }
        }, mode === 'document' ? 150000 : 60000);
        window.widget && window.widget.analyseRequest && window.widget.analyseRequest(mode, currentTaskText || null, reqId);
      }

      function attachAnalyseBtns() {
        var fb = document.getElementById('analyse-full');
        var wb = document.getElementById('analyse-window');
        var ab = document.getElementById('analyse-area');
        var db = document.getElementById('analyse-document');
        if (fb) fb.addEventListener('click', function() { startAnalyse('full'); });
        if (wb) wb.addEventListener('click', function() { startAnalyse('window'); });
        if (ab) ab.addEventListener('click', function() { startAnalyse('area'); });
        if (db) db.addEventListener('click', function() { startAnalyse('document'); });
      }
      attachAnalyseBtns();

    } else {
      panelBodyEl.innerHTML = '<textarea class="panel-input" id="panel-input" rows="3" placeholder="What distracted you?"></textarea>';
      panelFooter.style.display = 'flex';
      var inp4 = getInput();
      if (inp4) { setTimeout(function() { inp4.focus(); }, 50); }
    }
  }

  function closePanel() {
    stopBreathing();
    // Discard any in-flight AI requests — results will arrive but currentAction is now null
    pendingAI = {};
    currentAction = null;
    panelEl.classList.remove('open');
    document.querySelectorAll('.action-btn').forEach(function(b) { b.classList.remove('active'); });
    // Panel-open state first: the main process ignores hover-expand resets
    // while it still believes the panel is open (bar style).
    window.widget && window.widget.setPanelOpen(false);
    if (isCondensedWindow) setCondensedGrow(0);
    else window.widget && window.widget.setHoverExpand(0);
  }

  function savePanel() {
    var inp  = getInput();
    var text = inp ? inp.value.trim() : '';
    if (currentAction === 'explore') {
      if (text) runExplore(text);
      return;
    }
    if (text && currentAction) {
      var type = currentAction === 'park' ? 'park'
        : currentAction === 'distract' ? 'distraction'
        : 'stuck';
      if (currentAction === 'park') {
        var list = getWidgetParked();
        list.unshift({ text: text, ts: Date.now() });
        saveWidgetParked(list);
      }
      window.widget && window.widget.saveItem({ type: type, text: text });
      panelSavedEl.classList.add('show');
      setTimeout(closePanel, 900);
    } else {
      closePanel();
    }
  }

  document.body.setAttribute('data-pinned-bottom', 'false');

  if (window.widget) {
    window.widget.onUpdate(update);
    window.widget.onTheme(function(theme) {
      if (theme && theme !== 'default') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    });
    if (window.widget.onCustomVars) {
      var WIDGET_VAR_KEYS = ['bg','dim','border','divider','text','text-mid','text-idle','text-faint','accent','glow'];
      window.widget.onCustomVars(function(vars) {
        var root = document.documentElement;
        if (!vars) {
          for (var j = 0; j < WIDGET_VAR_KEYS.length; j++) {
            root.style.removeProperty('--w-' + WIDGET_VAR_KEYS[j]);
          }
          root.removeAttribute('data-light');
          return;
        }
        var wv = vars._widget || {};
        var keys = Object.keys(wv);
        for (var i = 0; i < keys.length; i++) {
          root.style.setProperty('--w-' + keys[i], wv[keys[i]]);
        }
        if (vars._light) {
          root.setAttribute('data-light', '');
        } else {
          root.removeAttribute('data-light');
        }
      });
    }
    window.widget.onStyle(function(style) {
      collapseTaskHover();
      // Main resets the window bounds on style change — just clear fan state
      closeAssistFan(true);
      closeAutopilotMenu(true);
      document.body.setAttribute('data-style', style);
      if (panelEl.classList.contains('open')) {
        window.widget.setPanelOpen(false);
        panelEl.classList.remove('open');
        document.querySelectorAll('.action-btn').forEach(function(b) { b.classList.remove('active'); });
        currentAction = null;
      }
    });
    window.widget.onPinBottom(function(pinned) {
      document.body.setAttribute('data-pinned-bottom', pinned ? 'true' : 'false');
      pinBottomBtn.classList.toggle('active', pinned);
    });
    window.widget.onAIResult(function(data) {
      var pending = pendingAI[data.requestId];
      if (!pending) return;
      delete pendingAI[data.requestId];
      if (data.error) { pending.reject(new Error(data.error)); }
      else { pending.resolve(data.result); }
    });
  }

  // The window resize when the flyout opens makes Chromium fire a transient
  // mouseleave on the task text, which used to close the flyout instantly.
  // So: leaving the task text only cancels a pending expand; an OPEN flyout
  // collapses when the pointer leaves the whole widget (debounced, and any
  // pointer activity inside cancels the pending collapse).
  // Dwell, don't pass through: the timer restarts on every move, so a
  // pointer sweeping across the strip (e.g. crossing the taskbar to click
  // an app icon) never opens the flyout — only a paused pointer does.
  function armTaskHover() {
    clearTimeout(collapseTimer);
    collapseTimer = null;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(expandTaskHover, 350);
  }
  taskEl.addEventListener('mouseenter', armTaskHover);
  taskEl.addEventListener('mousemove', function() {
    if (!hoverExpanded) armTaskHover();
  });
  taskEl.addEventListener('mouseleave', function() {
    clearTimeout(hoverTimer);
  });

  // Half-size strip hides the task text entirely, so its hover handlers can
  // never fire — the visible left area (dot + empty space) takes over as the
  // hover target. Gated to half mode so the full strip keeps the tighter
  // task-text-only target.
  var dragZoneEl = document.getElementById('drag-zone');
  function isHalfStrip() {
    return isCondensedWindow && document.body.getAttribute('data-half') === 'true';
  }
  dragZoneEl.addEventListener('mouseenter', function() {
    if (isHalfStrip()) armTaskHover();
  });
  dragZoneEl.addEventListener('mousemove', function() {
    if (isHalfStrip() && !hoverExpanded) armTaskHover();
  });
  dragZoneEl.addEventListener('mouseleave', function() {
    if (isHalfStrip()) clearTimeout(hoverTimer);
  });
  document.body.addEventListener('mouseleave', function() {
    clearTimeout(collapseTimer);
    collapseTimer = setTimeout(function() {
      collapseTaskHover();
      closeAssistFan();
      closeAutopilotMenu();
    }, 150);
  });
  document.addEventListener('mousemove', function() {
    if (collapseTimer) {
      clearTimeout(collapseTimer);
      collapseTimer = null;
    }
  });

  playBtnEl.addEventListener('click', function() {
    window.widget && window.widget.toggleTimer();

  document.getElementById('timer-dismiss').addEventListener('click', function() {
    timerCompleteEl.classList.remove('visible');
    window.widget && window.widget.dismissAlarm();

  doneBtnEl.addEventListener('click', function() {
    if (doneAnimating) return;
    doneAnimating = true;

    doneCheckEl.textContent = '✓';
    doneBtnEl.classList.add('completing');

    wrapperEl.classList.remove('done-glow');
    void wrapperEl.offsetWidth; // force reflow to restart animation
    wrapperEl.classList.add('done-glow');

    window.widget && window.widget.taskDone();

    taskFlashing = true;
    taskInnerEl.textContent = 'Next task Incoming!';
    taskEl.className = 'task-text next-task-flash';
    setTimeout(function() {
      taskFlashing = false;
      taskEl.classList.remove('next-task-flash');
    }, 2000);

    setTimeout(function() {
      doneBtnEl.classList.remove('completing');
      doneCheckEl.textContent = '□';
      wrapperEl.classList.remove('done-glow');
      doneAnimating = false;
    }, 2100);

  document.querySelectorAll('.action-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {

      } else {
        openPanel(action);

    if (addBtn && !addBtn.disabled) {

        addBtn.disabled = true;

  panelBodyEl.addEventListener('click', function(e) {
    if (currentAction !== 'strategy') return;

    // Convert-all button
    var addAllBtn = e.target.closest('.strategy-add-all');
    if (addAllBtn && !addAllBtn.disabled) {
      strategySteps.forEach(function(s) {
        if (window.widget && window.widget.exploreAddTask) {
          window.widget.exploreAddTask({ text: s, parentText: currentTaskText || null });

      });
      addAllBtn.textContent = '✓ All steps added';
      addAllBtn.disabled = true;
      return;
    }

    var stepAdd = e.target.closest('.strategy-step-add');
    if (stepAdd && !stepAdd.disabled) {
      var stepText = strategySteps[parseInt(stepAdd.dataset.i, 10)];
      if (stepText && window.widget && window.widget.exploreAddTask) {
        window.widget.exploreAddTask({ text: stepText, parentText: currentTaskText || null });
        stepAdd.textContent = '✓';
        stepAdd.disabled = true;
      }
      return;
    }

    var step = e.target.closest('.strategy-step');
    if (step) {
      step.classList.toggle('done');
      var total = panelBodyEl.querySelectorAll('.strategy-step').length;
      var done = panelBodyEl.querySelectorAll('.strategy-step.done').length;
      var fill = document.getElementById('strategy-progress-fill');
      if (fill) fill.style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
      // Persist tick state per task
      try {
        var ticks = Array.from(panelBodyEl.querySelectorAll('.strategy-step')).map(function(s) { return s.classList.contains('done'); });
        var tickKey = 'widget:strategy-ticks:' + (currentTaskText || '');
        localStorage.setItem(tickKey, JSON.stringify(ticks));
      } catch {}
    }

  // Stuck panel: complication accordion + block-type selector + help button + chip-add
  panelBodyEl.addEventListener('click', function(e) {

    var compHead = e.target.closest('.stuck-comp-head');

          if (!area) return;
          if (result) {
            var rhtml = '';
            if (result.why) rhtml += aiCardHtml('', 'What\'s blocking you', escHtml(result.why));
            if (result.firstStep) rhtml += aiCardHtml('green', 'First step', escHtml(result.firstStep), 0.08);
            if (result.reframe) rhtml += aiCardHtml('', 'Reframe', escHtml(result.reframe), 0.16);
            if (result.fiveMinCommit) rhtml += aiCardHtml('amber', '5-min commit', escHtml(result.fiveMinCommit), 0.24);
            if (result.principle) rhtml += aiCardHtml('', 'Strategy', escHtml(result.principle));
            if (result.startWith) rhtml += aiCardHtml('green', 'Start with', escHtml(result.startWith), 0.08);
            if (result.gap) rhtml += aiCardHtml('amber', 'What\'s missing', escHtml(result.gap));
            if (result.findIt) rhtml += aiCardHtml('', 'Find it fast', escHtml(result.findIt), 0.08);
            if (result.unblock) rhtml += aiCardHtml('green', 'Move forward now', escHtml(result.unblock), 0.16);
            if (result.subTasks && result.subTasks.length) {
              rhtml += '<span class="ai-section-label">Sub-tasks</span><ul class="panel-tips">';
              result.subTasks.forEach(function(s) {
                var txt = s.text || s;
                rhtml += '<li><span class="analyse-sug-text">' + escHtml(txt + (s.estimate ? ' (' + s.estimate + ')' : ''))
                  + '</span><button class="explore-item-add stuck-sub-add" data-text="' + escHtml(txt) + '" title="Add as sub-task">+</button></li>';
              });
              rhtml += '</ul>';
            }
            area.innerHTML = rhtml || '<p class="ai-intro">No specific advice — try describing your blocker above.</p>';
          } else {
            area.innerHTML = '<p class="panel-error">Could not get help. Check your AI settings.</p>';
          }
        }).catch(function(err) {
          if (currentAction !== 'stuck') return;
          var area = document.getElementById('stuck-detail-area');
          if (area) area.innerHTML = '<p class="panel-error">' + escHtml(err.message || 'Could not get help.') + '</p>';
        });
        return;
      }

      // Quick-win chip: add as a top-level task. Quick wins come from the
      // whole-board stuck analysis, so they must not nest under the active
      // task (subtasks are hidden until the parent row is expanded).
      var chipAdd = e.target.closest('.ai-chip-add');
      if (chipAdd && !chipAdd.disabled) {
        var chip = chipAdd.closest('.ai-chip');
        var chipText = chip ? chip.dataset.qtext : null;
        if (chipText && window.widget && window.widget.exploreAddTask) {
          window.widget.exploreAddTask({ text: chipText, parentText: null });
          chipAdd.textContent = '✓';
          chipAdd.disabled = true;
        }
        return;
      }

      // Sub-task add from stuck-detail result
      var subAdd = e.target.closest('.stuck-sub-add');
      if (subAdd && !subAdd.disabled) {
        var subText = subAdd.dataset.text;
        if (subText && window.widget && window.widget.exploreAddTask) {
          window.widget.exploreAddTask({ text: subText, parentText: currentTaskText || null });
          subAdd.textContent = '✓';
          subAdd.disabled = true;
        }
        return;
      }
    }
  });

  // Explore panel interactions (delegated — the body re-renders per level).
  panelBodyEl.addEventListener('click', function(e) {
    if (currentAction !== 'explore') return;
    if (e.target.closest('#explore-back')) {
      exploreStack.pop();
      renderExplore();
      return;
    }
    var go = e.target.closest('#explore-go');
    if (go) {
      var typed = getInput() ? getInput().value.trim() : '';
      if (typed) runExplore(typed);
      return;
    }
    var textBtn = e.target.closest('.explore-item-text');
    if (textBtn) {
      var item = getExploreItem(textBtn.dataset.sec, textBtn.dataset.i);
      if (item) runExplore(item);
      return;
    }
    var addBtn = e.target.closest('.explore-item-add');
    if (addBtn && !addBtn.disabled) {
      var task = getExploreItem(addBtn.dataset.sec, addBtn.dataset.i);
      if (task && window.widget && window.widget.exploreAddTask) {
        // Lands as a subtask of the task the exploration started from, or a
        // new task when explored free-form.
        window.widget.exploreAddTask({ text: task, parentText: exploreRootTask });
        addBtn.textContent = '✓';
        addBtn.disabled = true;
      }
    }
  });

  document.getElementById('close-btn').addEventListener('click', function() {
    window.widget && window.widget.minimizeToTray();
  });

  [1, 2, 3, 4].forEach(function(n) {
    var btn = document.getElementById('snap-btn-' + n);
    btn.addEventListener('click', function() {
      window.widget && window.widget.snapWindows(n);
      btn.classList.add('snapped');
      setTimeout(function() { btn.classList.remove('snapped'); }, 600);
    });
  });

  var pinBottomBtn = document.getElementById('pin-bottom-btn');
  pinBottomBtn.addEventListener('click', function() {
    window.widget && window.widget.togglePinBottom();
  });

  document.getElementById('panel-body').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closePanel(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { savePanel(); }
  });

  var taskbarBtn = document.getElementById('taskbar-btn');
  taskbarBtn.addEventListener('click', function() {
    window.widget && window.widget.toggleTaskbar();
  });

  if (window.widget) {
    window.widget.onTaskbar(function(enabled) {
      taskbarBtn.classList.toggle('active', enabled);
      taskbarBtn.title = enabled ? 'Unpin from taskbar' : 'Pin to taskbar';
      taskbarBtn.textContent = enabled ? '⊞' : '⊟';
    });
  }

  assistBtnEl.addEventListener('click', function() {
    if (assistOpen) { closeAssistFan(); return; }
    if (panelEl.classList.contains('open')) closePanel();
    openAssistFan();
  });

  // Half-size strip: the Assist button lives in the hover flyout instead of
  // the bar. openAssistFan clears the flyout state itself and grows the
  // window straight to fan height — no bounce through base height.
  document.getElementById('task-hover-assist').addEventListener('click', function(e) {
    e.stopPropagation();
    if (panelEl.classList.contains('open')) closePanel();
    openAssistFan();
  });

  var openAppBtnEl = document.getElementById('open-app-btn');
  openAppBtnEl.addEventListener('click', function() {
    window.widget && window.widget.toggleMain();
  });

  // ── AI-Autopilot: one launcher, two options. The button reveals a small
  // menu (same reveal/anchor mechanics as the assist fan); picking an option
  // runs it and the launcher itself carries the busy/pulse state.
  var autopilotBtnEl = document.getElementById('ai-autopilot-btn');
  var autopilotMenuEl = document.getElementById('autopilot-menu');
  var autopilotOpen = false;

  function openAutopilotMenu() {
    if (autopilotOpen) return;
    if (autopilotBtnEl.classList.contains('busy')) return; // running — no reopen
    var style = document.body.getAttribute('data-style');
    // Mutually exclusive with the assist fan; keep the window grown so we
    // resize straight to the menu height (no shrink/grow bounce).
    closeAssistFan(true);
    clearTimeout(hoverTimer);
    hoverTimer = null;
    clearTimeout(collapseTimer);
    collapseTimer = null;
    hoverExpanded = false;
    document.body.removeAttribute('data-hover-expand');
    holdEntranceUntilResize();
    document.body.setAttribute('data-autopilot-open', 'true');
    autopilotOpen = true;
    autopilotBtnEl.classList.add('active');
    if (!isCondensedWindow && style === 'sidebar') return; // full-height, inline
    assistGrow(Math.min(220, autopilotMenuEl.offsetHeight));
  }

  function closeAutopilotMenu(keepGrow) {
    if (!autopilotOpen) return;
    autopilotOpen = false;
    document.body.removeAttribute('data-autopilot-open');
    autopilotBtnEl.classList.remove('active');
    if (!keepGrow) assistGrow(0);
  }

  autopilotBtnEl.addEventListener('click', function() {
    if (autopilotBtnEl.classList.contains('busy')) return;
    if (autopilotOpen) { closeAutopilotMenu(); return; }
    if (panelEl.classList.contains('open')) closePanel();
    openAutopilotMenu();
  });

  autopilotMenuEl.addEventListener('click', function(e) {
    var item = e.target.closest('.autopilot-item');
    if (!item) return;
    var action = item.dataset.action;
    closeAutopilotMenu();
    if (action === 'window') runWindowTasks();
    else if (action === 'goal') runGoalTasks();
  });

  // AI-Window-Tasks: the main app runs the full pipeline (scan → form → assign)
  // in the background — no window focus. The launcher pulses, blurred and
  // unclickable, until the app's explicit completion signal; the long timer
  // is only a safety net for a dead main window, not the normal path.
  function finishAutomate() {
    automateWaiting = false;
    clearTimeout(automateTimer);
    autopilotBtnEl.classList.remove('busy');
    autopilotBtnEl.disabled = false;
  }

  function runWindowTasks() {
    if (automateWaiting || autopilotBtnEl.disabled) return;
    automateWaiting = true;
    autopilotBtnEl.classList.add('busy');
    autopilotBtnEl.disabled = true;
    if (!taskFlashing) taskInnerEl.textContent = 'Choosing a task…';
    window.widget && window.widget.aiAutomate();
    clearTimeout(automateTimer);
    automateTimer = setTimeout(finishAutomate, 120000);
  }

  window.widget && window.widget.onAutomateDone && window.widget.onAutomateDone(function(result) {
    finishAutomate();
    if (result && result.ok === false) {
      if (!taskFlashing) {
        var prev = currentTaskText || currentContextTaskText || 'No active task';
        taskInnerEl.textContent = 'Nothing to automate right now';
        setTimeout(function() {
          if (!taskFlashing) taskInnerEl.textContent = prev;
        }, 3000);
      }
    } else {
      // Assigned: flash the chosen task when its widget:update push lands.
      automateFlashPending = true;
    }
  });

  // AI-Goal-Tasks: unlike Window-Tasks this is NOT a background pipeline — the
  // main app comes forward and shows the plan, so there is no completion
  // round-trip. Just fire it and flash the launcher briefly so the click reads.
  function runGoalTasks() {
    if (autopilotBtnEl.disabled) return;
    autopilotBtnEl.classList.add('busy');
    autopilotBtnEl.disabled = true;
    window.widget && window.widget.aiGoalTasks();
    setTimeout(function() {
      autopilotBtnEl.classList.remove('busy');
      autopilotBtnEl.disabled = false;
    }, 1500);
  }

  document.getElementById('widget-capture-btn').addEventListener('click', function() {
    window.widget && window.widget.openCapture();
  });

  assistFanEl.addEventListener('click', function(e) {
    var item = e.target.closest('.assist-fan-item');
    if (!item) return;
    if (item.dataset.action === 'capture') {
      if (currentContextTaskText) {
        window.widget && window.widget.contextCapture(currentContextTaskText);
      }
      closeAssistFan();
      return;
    }
    trackFanUsage(item.dataset.action);
    openPanel(item.dataset.action);
  });

  // The panel's height is content-driven (AI results arrive async), so track
  // it and keep the window grown to fit. The condensed strip grows via the
  // anchored hover-expand path; bar/pill re-report through set-panel-open and
  // the main process clamps + resizes (sidebar ignores the height).
  if (window.ResizeObserver) {
    new ResizeObserver(function() {
      if (!panelEl.classList.contains('open')) return;
      if (isCondensedWindow) {
        setCondensedGrow(Math.min(220, panelEl.offsetHeight));
      } else {
        window.widget && window.widget.setPanelOpen(true, panelEl.offsetHeight);
      }
    }).observe(panelEl);
  }

  var condenseBtn = document.getElementById('condense-btn');
  condenseBtn.addEventListener('click', function() {
    window.widget && window.widget.toggleCondense();
  });

  var halfBtn = document.getElementById('half-btn');
  halfBtn.textContent = '◧';
  halfBtn.addEventListener('click', function() {
    // Close any open overlay first — the strip is about to be re-embedded
    // at the new width, so grown bounds would be stale.
    if (panelEl.classList.contains('open')) closePanel();
    closeAssistFan();
    collapseTaskHover();
    window.widget && window.widget.toggleCondensedHalf();
  });
  if (window.widget && window.widget.onCondensedHalf) {
    window.widget.onCondensedHalf(function(half) {
      document.body.setAttribute('data-half', half ? 'true' : 'false');
      halfBtn.textContent = half ? '◨' : '◧';
      halfBtn.title = half ? 'Expand to full size' : 'Half-size strip';
    });
  }
  if (isCondensedWindow) {
    condenseBtn.textContent = '▴';
    condenseBtn.title = 'Expand widget';
  }

  document.getElementById('main-bar').addEventListener('dblclick', function() {
    if (document.body.getAttribute('data-condensed') === 'true') {
      window.widget && window.widget.toggleCondense();
    }
  });

  if (window.widget) {
    window.widget.onCondense(function(condensed) {
      hoverExpanded = false;
      clearTimeout(hoverTimer);
      document.body.removeAttribute('data-hover-expand');
      document.body.setAttribute('data-condensed', condensed ? 'true' : 'false');
      condenseBtn.title = condensed ? 'Expand widget' : 'Condense to taskbar';
      condenseBtn.textContent = condensed ? '▴' : '▾';
    });
  }

  var celebrationOverlayEl  = document.getElementById('celebration-overlay');
  var celebrationLoadingEl  = document.getElementById('celebration-loading');
  var celebrationContentEl  = document.getElementById('celebration-content');
  var celebrationHeadlineEl = document.getElementById('celebration-headline');
  var celebrationBodyEl     = document.getElementById('celebration-body');
  var celebrationExtrasEl   = document.getElementById('celebration-extras');
  var celebrationNextMoveEl = document.getElementById('celebration-next-move');
  var celebrationNextLblEl  = document.getElementById('celebration-next-label');
  var celebrationNextWhyEl  = document.getElementById('celebration-next-why');
  var celebrationDismissEl  = document.getElementById('celebration-dismiss');

  function showCelebration(data) {
    collapseTaskHover();
    if (!celebrationOverlayEl.classList.contains('active')) holdEntranceUntilResize();
    celebrationOverlayEl.classList.add('active');

    if (!data || data === 'loading') {
      celebrationLoadingEl.style.display = 'flex';
      celebrationContentEl.style.display = 'none';
      return;
    }

    celebrationLoadingEl.style.display = 'none';
    celebrationContentEl.style.display = 'flex';
    celebrationHeadlineEl.textContent = data.headline || '';
    celebrationBodyEl.textContent = data.body || '';

    celebrationExtrasEl.innerHTML = '';
    if (data.goalLink) {
      var gl = document.createElement('p');
      gl.className = 'celebration-goal-link';
      gl.textContent = data.goalLink;
      celebrationExtrasEl.appendChild(gl);
    }
    if (data.streakNote) {
      var sn = document.createElement('p');
      sn.className = 'celebration-streak';
      sn.textContent = data.streakNote;
      celebrationExtrasEl.appendChild(sn);
    }

    if (data.nextMove) {
      celebrationNextLblEl.textContent = data.nextMove.label || '';
      celebrationNextWhyEl.textContent = data.nextMove.why || '';
      celebrationNextMoveEl.style.display = '';
    } else {
      celebrationNextMoveEl.style.display = 'none';
    }
  }

  function dismissCelebrationWidget() {
    celebrationOverlayEl.classList.remove('active');
    window.widget && window.widget.dismissCelebration();
  }

  if (window.widget) {
    window.widget.onCelebration(function(data) {
      if (data) {
        showCelebration(data);
      } else {
        celebrationOverlayEl.classList.remove('active');
      }
    });
  }

  celebrationDismissEl.addEventListener('click', dismissCelebrationWidget);
  celebrationNextMoveEl.addEventListener('click', dismissCelebrationWidget);

  // ── Hover tooltips for assist fan buttons ─────────────────────────────────
  (function() {
    var tip = document.getElementById('btn-tooltip');
    var showTimer = null;

    function showTip(text, rect) {
      tip.textContent = text;
      tip.classList.remove('visible');
      // position above the button, centred
      var tw = tip.offsetWidth;
      var x = rect.left + rect.width / 2 - tw / 2;
      var y = rect.top - tip.offsetHeight - 7;
      // clamp to viewport
      x = Math.max(4, Math.min(x, window.innerWidth - tw - 4));
      if (y < 4) y = rect.bottom + 7; // flip below if no room above
      tip.style.left = x + 'px';
      tip.style.top  = y + 'px';
      tip.classList.add('visible');
    }

    function hideTip() {
      clearTimeout(showTimer);
      tip.classList.remove('visible');
    }

    document.querySelectorAll('.assist-fan-item[data-tooltip]').forEach(function(btn) {
      btn.addEventListener('mouseenter', function() {
        clearTimeout(showTimer);
        showTimer = setTimeout(function() {
          showTip(btn.getAttribute('data-tooltip'), btn.getBoundingClientRect());
        }, 300);
      });
      btn.addEventListener('mouseleave', hideTip);
      btn.addEventListener('click', hideTip);
    });
  })();
</script>
</body>
</html>
